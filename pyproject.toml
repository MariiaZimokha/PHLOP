[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phlop"
version = "0.1.0"
description = "PHLOP project"
authors = [{name = ""}]
dependencies = [
    "mujoco",
    "mujoco-py",
    "numpy",
    "opencv-python",
    "matplotlib",
    "scipy",
    "glfw",
    "imageio",
    "imageio[ffmpeg]",
    "pyopengl",
    "tqdm",
    "ruff",
    "pyarrow",
    "fastparquet",
    "huggingface-hub>=1.3.4",
    "jupyterlab>=4.5.5",
    "datasets>=4.7.0",
    "ipywidgets>=8.1.8",
    "transformers>=5.3.0",
    "accelerate>=1.13.0",
    "peft>=0.18.1",
    "bitsandbytes>=0.49.2",
    "pillow>=12.1.0",
    "torchvision>=0.25.0",
    "num2words>=0.5.14",
]

[tool.setuptools.packages.find]
where = ["."]
